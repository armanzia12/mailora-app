services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: mailora
      POSTGRES_PASSWORD: mailora_local_password
      POSTGRES_DB: mailora
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

  api:
    build: ./backend
    environment:
      PORT: 4000
      DATABASE_URL: postgres://mailora:mailora_local_password@db:5432/mailora
    ports:
      - "4000:4000"
    depends_on:
      - db

  web:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - api
